name: Bug report
description: Something is broken or unexpected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Do not attach `%APPDATA%\LuxTray\config.json` if it contains paths you consider private.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LuxTray version
      placeholder: "0.1.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Optional excerpts from `%APPDATA%\LuxTray\launch.log` or `panic.log`
      render: text
